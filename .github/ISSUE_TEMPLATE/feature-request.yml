name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the need and desired outcome. The development team will determine the implementation.
  - type: textarea
    id: problem
    attributes:
      label: What problem or need does this address?
      description: Explain the current situation and why it should change.
      placeholder: Describe the problem from the user's perspective.
    validations:
      required: true
  - type: textarea
    id: requested-outcome
    attributes:
      label: Requested outcome
      description: Describe what should be possible when this work is complete.
      placeholder: Describe the result rather than prescribing technical implementation details.
    validations:
      required: true
  - type: textarea
    id: beneficiaries
    attributes:
      label: Who benefits?
      placeholder: Visitors, applicants, staff, event attendees, developers, or another group.
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would show the request is complete.
      placeholder: |
        - [ ] A user can ...
        - [ ] The page displays ...
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples, designs, or additional context
      description: Add links, screenshots, mockups, deadlines, or related issues if available.